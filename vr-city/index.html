<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="game-version" content="1">
<title>Abandoned City 🌃</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(5,6,12,.9); z-index: 5; text-align: center; padding: 16px; }
  #ui h1 { font-size: 30px; margin: 0; color: #d34; }
  #ui p { margin: 0; max-width: 520px; line-height: 1.4; }
  #ui button { font-size: 22px; padding: 14px 26px; border-radius: 14px; border: 2px solid #a22; background: #1d0a0c; color: #fff; cursor: pointer; }
  #ui button.small { font-size: 16px; border-color: #335; background: #0c1020; }
  #status { position: fixed; left: 10px; top: 10px; font-size: 14px; color: #9c9; z-index: 4; text-shadow: 0 0 4px #000; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="status">🔎 Looking for your friend…</div>
<div id="ui">
  <h1>🌃 The Abandoned City</h1>
  <p>Stars 🌟, crickets 🦗, and something that sings "la la la!" 😈</p>
  <p>Put on your headset. Your headlights keep the monsters away… for a while 🔦</p>
  <button id="mic" class="small">🎙️ Turn on voice chat</button>
  <button id="go">🚪 Enter the city</button>
  <p id="hint" style="font-size:14px;opacity:.7"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
